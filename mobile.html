<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f9fafb" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>DeepSeek Harness</title>
<style>
/* ============================================================
   DeepSeek Harness WebUI 复刻 — 单文件移动端版
   设计 token 取自 dsh web 运行时实际 CSS（light / dark 双套）
   ============================================================ */
:root {
  --ds-ease: cubic-bezier(.4,0,.2,1);
  --ds-dur-slow: .3s;
  --ds-dur: .2s;
  --ds-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --ds-font-code: "SF Mono", "JetBrains Mono", "Fira Code", Consolas, "Liberation Mono", monospace;
  --shadow-lv1: 0 2px 4px 0 rgba(0,0,0,.05);
  --shadow-lv2: 0 4px 12px 0 rgba(0,0,0,.02), 0 2px 8px 0 rgba(0,0,0,.04);
  --shadow-lv3: 0 0 1px 0 rgba(0,0,0,.2), 0 0 4px 0 rgba(0,0,0,.02), 0 12px 32px 0 rgba(0,0,0,.08);
  --chat-content-width: 748px;
  --composer-card-max-width: calc(var(--chat-content-width) + 32px);
  --composer-clearance: 16px;
  --composer-text-max-height: 336px;
}
body {
  --c-bg-base: #ffffff;
  --c-bg-layer-1: #ffffff;
  --c-bg-layer-2: #ffffff;
  --c-bg-layer-3: #ffffff;
  --c-bg-overlay: #e9ecf2;
  --c-bg-module-platform: #f9fafb;
  --c-bg-skeleton: rgba(0,0,0,.04);
  --c-border-l1: rgba(0,0,0,.04);
  --c-border-l2: rgba(0,0,0,.1);
  --c-border-l2-thin: rgba(0,0,0,.1);
  --c-border-l3: rgba(0,0,0,.12);
  --c-border-l4: rgba(0,0,0,.16);
  --c-border-inverted: rgba(0,0,0,.06);
  --c-label-primary: #0f1115;
  --c-label-primary-dimmed: #151517;
  --c-label-secondary: #61666b;
  --c-label-tertiary: #81858c;
  --c-label-caption: #adb2b8;
  --c-label-dimmed: #e1e5ee;
  --c-label-quaternary: #cfd3d6;
  --c-brand-primary: #0f1115;
  --c-brand-text: #0f1115;
  --c-button-info-fill: #4176e6;
  --c-button-info-hover: #679efe;
  --c-button-primary-fill: #0f1115;
  --c-button-primary-hover: #43454a;
  --c-button-floating-fill: #ffffff;
  --c-button-floating-hover: #f1f3f5;
  --c-interactive-hover: rgba(38,49,72,.06);
  --c-interactive-active: rgba(38,49,72,.1);
  --c-interactive-hover-solid: #f1f3f5;
  --c-interactive-hover-danger: rgba(236,19,19,.05);
  --c-state-business: #4176e6;
  --c-state-business-tertiary: #e4edfd;
  --c-state-error: #ec1313;
  --c-state-error-secondary: #f25a5a;
  --c-state-success: #22c55e;
  --c-state-success-secondary: #4ed17e;
  --c-state-success-tertiary: #e6faed;
  --c-state-warn: #f59e0b;
  --c-state-warn-secondary: #f7ad31;
  --c-state-warn-tertiary: #fef5e7;
  --c-state-warn-label: #dd8629;
  --c-md-code-block: #f9fafb;
  --c-md-code-banner: #f9fafb;
  --c-md-inline-code: #ebeef2;
  --c-md-tag: #f1f3f5;
  --c-bubble: #edf3fe;
  --c-bubble-highlight: #d3e2ff;
  --c-input-major: #ffffff;
  --c-menu: #ffffff;
  --c-selector: #f9fafb;
  --c-sidebar-fill: #f9fafb;
  --c-nav-item-active: #ebeef2;
  --c-nav-item-hover: #f1f3f5;
  --c-nav-item-accent: #e4edfd;
  --c-tip: #f9fafb;
  --c-sep: rgba(0,0,0,.08);
  --c-toast-bg: #353638;
  --c-tooltip-bg: #2c2c2e;
  --c-scrollbar: #e5e5e5;
  --c-scrollbar-hover: #d4d4d4;
  --c-shiki: #24292e;
  --c-shiki-comment: #6a737d;
  --c-shiki-string: #032f62;
  --c-shiki-kw: #d73a49;
  --c-shiki-fn: #6f42c1;
  --c-shiki-num: #005cc5;
}
body[data-ds-dark-theme] {
  --c-bg-base: #151517;
  --c-bg-layer-1: #232324;
  --c-bg-layer-2: #2c2c2e;
  --c-bg-layer-3: #353638;
  --c-bg-overlay: #61666b;
  --c-bg-module-platform: #353638;
  --c-bg-skeleton: rgba(255,255,255,.08);
  --c-border-l1: rgba(255,255,255,.06);
  --c-border-l2: rgba(255,255,255,.12);
  --c-border-l2-thin: rgba(255,255,255,.06);
  --c-border-l3: rgba(255,255,255,.16);
  --c-border-l4: rgba(255,255,255,.2);
  --c-border-inverted: rgba(255,255,255,.06);
  --c-label-primary: #f9fafb;
  --c-label-primary-dimmed: #ebeef2;
  --c-label-secondary: #cfd3d6;
  --c-label-tertiary: #adb2b8;
  --c-label-caption: #979da6;
  --c-label-dimmed: #43454a;
  --c-label-quaternary: #61666b;
  --c-brand-primary: #f9fafb;
  --c-brand-text: #f9fafb;
  --c-button-info-fill: #679efe;
  --c-button-info-hover: #4176e6;
  --c-button-primary-fill: #f9fafb;
  --c-button-primary-hover: #ebeef2;
  --c-button-floating-fill: #2c2c2e;
  --c-button-floating-hover: #353638;
  --c-interactive-hover: rgba(255,255,255,.08);
  --c-interactive-active: rgba(255,255,255,.14);
  --c-interactive-hover-solid: #353638;
  --c-interactive-hover-danger: rgba(242,90,90,.15);
  --c-state-business: #679efe;
  --c-state-business-tertiary: #34415b;
  --c-state-error: #f25a5a;
  --c-state-error-secondary: #f25a5a;
  --c-state-success: #22c55e;
  --c-state-success-secondary: #4ed17e;
  --c-state-success-tertiary: #233c2c;
  --c-state-warn: #f59e0b;
  --c-state-warn-secondary: #f7ad31;
  --c-state-warn-tertiary: #27241f;
  --c-state-warn-label: #f7ad31;
  --c-md-code-block: #1b1b1c;
  --c-md-code-banner: #2c2c2e;
  --c-md-inline-code: #2c2c2e;
  --c-md-tag: #2c2c2e;
  --c-bubble: #2c2c2e;
  --c-bubble-highlight: #43454a;
  --c-input-major: #2c2c2e;
  --c-menu: #353638;
  --c-selector: #353638;
  --c-sidebar-fill: #1b1b1c;
  --c-nav-item-active: #43454a;
  --c-nav-item-hover: #2c2c2e;
  --c-nav-item-accent: #353638;
  --c-tip: #353638;
  --c-sep: rgba(255,255,255,.1);
  --c-toast-bg: #61666b;
  --c-tooltip-bg: #61666b;
  --c-scrollbar: #3c3c3d;
  --c-scrollbar-hover: #646464;
  --c-shiki: #e1e4e8;
  --c-shiki-comment: #8b949e;
  --c-shiki-string: #9ecbff;
  --c-shiki-kw: #ff7b72;
  --c-shiki-fn: #d2a8ff;
  --c-shiki-num: #79c0ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--ds-font);
  font-size: 14px;
  line-height: 22px;
  color: var(--c-label-primary);
  background: var(--c-bg-base);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  color-scheme: light;
}
body[data-ds-dark-theme] { color-scheme: dark; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
textarea:focus, input:focus { outline: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { border-radius: 4px; background: var(--c-scrollbar); }
::-webkit-scrollbar-thumb:hover { background: var(--c-scrollbar-hover); }
::-webkit-scrollbar-corner { background: transparent; }
.ic { display: inline-flex; flex: none; vertical-align: middle; }
.ic svg { display: block; }
.hidden { display: none !important; }

/* ============ 三栏 Frame ============ */
.frame {
  display: grid;
  grid-template-columns: 56px minmax(0,1fr) 0px;
  grid-template-rows: 100%;
  height: 100%;
  background: var(--c-bg-base);
  transition: grid-template-columns var(--ds-dur-slow) var(--ds-ease);
  position: relative;
  overflow: hidden;
}
.frame.sidebar-open { grid-template-columns: 280px minmax(0,1fr) 0px; }
.frame.details-open { grid-template-columns: 56px minmax(0,1fr) 360px; }
.frame.sidebar-open.details-open { grid-template-columns: 280px minmax(0,1fr) 360px; }
@media (min-width: 1024px) {
  .frame { grid-template-columns: 280px minmax(0,1fr) 0px; }
  .frame.sidebar-collapsed { grid-template-columns: 56px minmax(0,1fr) 0px; }
  .frame.sidebar-open { grid-template-columns: 280px minmax(0,1fr) 0px; }
  .frame.details-open { grid-template-columns: 280px minmax(0,1fr) 360px; }
  .frame.sidebar-collapsed.details-open { grid-template-columns: 56px minmax(0,1fr) 360px; }
}
.sidebar-col { background: var(--c-sidebar-fill); border-right: 1px solid var(--c-border-l1); min-width: 0; overflow: hidden; }
.center-col { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.details-col { border-left: 1px solid var(--c-border-l2); min-width: 0; overflow: hidden; }

/* ============ 侧栏（宽） ============ */
.sidebar-root {
  --dsh-sidebar-inline-padding: 12px;
  height: 100%;
  padding: 6px var(--dsh-sidebar-inline-padding);
  background: var(--c-sidebar-fill);
  display: flex;
  flex-direction: column;
  font-size: 14px;
  color: var(--c-label-primary);
  overflow: hidden;
}
.rail-root { display: none; }
.sidebar-col.rail-mode .sidebar-root { display: none; }
.sidebar-col.rail-mode .rail-root {
  display: flex; flex-direction: column; align-items: center;
  height: 100%; padding: 18px 10px 6px;
  background: var(--c-sidebar-fill);
}
.logo-row {
  flex: none; display: flex; align-items: center; justify-content: flex-end;
  gap: 8px; height: 60px; margin-bottom: 8px; padding: 8px 0 8px 4px; overflow: hidden;
}
.brand {
  min-width: 0; flex: 1; display: inline-flex; align-items: center;
  gap: 8px; padding: 0; overflow: hidden; text-align: left;
}
.wordmark { display: flex; align-items: center; gap: 8px; min-width: 0; }
.wordmark-fish { color: var(--c-label-primary); flex: none; }
.wordmark-text {
  font-size: 15px; font-weight: 600; letter-spacing: .02em; line-height: 20px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wordmark-sub { color: var(--c-label-tertiary); font-weight: 400; font-size: 13px; }
.icon-btn {
  width: 28px; height: 28px; flex: none; display: inline-flex; align-items: center;
  justify-content: center; border-radius: 50%; color: var(--c-label-secondary);
  transition: background .1s;
}
.icon-btn:hover { background: var(--c-interactive-hover); }
.icon-btn:active { background: var(--c-interactive-active); }
.new-session {
  flex: none; display: flex; align-items: center; justify-content: flex-start;
  gap: 8px; width: 100%; height: 36px; padding: 0 12px;
  background: var(--c-selector); color: var(--c-label-primary);
  border-radius: 12px; font-size: 14px; font-weight: 500; line-height: 20px;
  transition: background .1s;
}
.new-session:hover { background: var(--c-interactive-hover-solid); }
.new-session:active { background: var(--c-interactive-active); }
.new-session .ic { color: var(--c-label-secondary); }
.region-area { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 14px; overflow: hidden; }
.search-box {
  flex: none; display: flex; align-items: center; gap: 6px;
  height: 32px; margin-bottom: 10px; padding: 0 10px;
  background: var(--c-interactive-hover); border-radius: 8px; color: var(--c-label-caption);
}
.search-box input {
  flex: 1; min-width: 0; background: none; border: none; font-size: 13px; line-height: 20px; color: var(--c-label-primary);
}
.search-box input::placeholder { color: var(--c-label-caption); }
.ws-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.sec-label {
  flex: none; color: var(--c-label-secondary); font-size: 12px; font-weight: 500;
  line-height: 18px; margin: 0 8px 6px;
}
.ws-group { display: flex; flex-direction: column; margin-bottom: 10px; }
.project-row, .session-row {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 0 8px; border-radius: 8px; cursor: pointer; user-select: none;
  color: var(--c-label-primary);
}
.project-row { height: 34px; }
.project-row:hover, .session-row:hover, .session-row.selected { background: var(--c-interactive-hover); }
.session-row { height: 32px; animation: row-in .15s var(--ds-ease); }
@keyframes row-in { from { opacity: 0; } }
.project-chev { color: var(--c-label-caption); flex: none; transition: transform .15s var(--ds-ease); }
.project-chev.open { transform: rotate(90deg); }
.project-folder { color: var(--c-label-tertiary); flex: none; }
.project-folder.active { color: var(--c-state-business); }
.project-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.project-name { font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.project-meta { font-size: 12px; line-height: 17px; color: var(--c-label-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-slot { width: 16px; height: 20px; display: inline-flex; justify-content: center; align-items: center; color: var(--c-label-tertiary); flex: none; }
.session-dot { flex: none; }
.session-title { flex: 1; min-width: 0; font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 6px 0 4px; }
.session-time { flex: none; color: var(--c-label-tertiary); font-size: 12px; line-height: 20px; }
.session-actions { flex: none; display: none; align-items: center; gap: 8px; }
.project-row:hover .session-actions, .session-row:hover .session-actions { display: inline-flex; }
.session-row:hover .session-time { display: none; }
.sa-btn { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: var(--c-label-tertiary); border-radius: 4px; }
.sa-btn:hover { color: var(--c-label-primary); }
.foot-area {
  flex: none; display: flex; flex-direction: column; gap: 2px;
  padding: 8px 0 2px; border-top: 1px solid var(--c-border-l1); margin-top: 8px;
}
.foot-row-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 32px;
  padding: 0 10px; border-radius: 8px; color: var(--c-label-secondary); font-size: 13px; line-height: 20px;
}
.foot-row-btn:hover { background: var(--c-interactive-hover); color: var(--c-label-primary); }
.foot-row-btn .ic { color: var(--c-label-secondary); }
/* rail */
.rail-btn {
  width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center;
  justify-content: center; border-radius: 50%; color: var(--c-label-secondary); margin-bottom: 8px;
}
.rail-btn:hover { background: var(--c-interactive-hover); color: var(--c-label-primary); }
.rail-btn.fish { color: var(--c-label-primary); }
.rail-spacer { flex: 1; }

/* ============ 会话中心 ============ */
.chat-root {
  flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column;
  background: var(--c-bg-base);
}
.chat-header {
  flex: none; position: relative; padding: calc(8px + env(safe-area-inset-top, 0px)) 20px 0;
  border-bottom: 1px solid transparent;
}
.chat-header::after {
  content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: var(--c-border-l2); pointer-events: none; z-index: 0;
}
.title-row { display: flex; align-items: center; min-height: 32px; gap: 8px; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; }
.crumb {
  max-width: 160px; padding: 4px 8px; border-radius: 12px; font-size: 14px; line-height: 20px;
  color: var(--c-label-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer; border: none; background: none;
}
.crumb:hover { background: var(--c-interactive-hover); }
.crumb.current { color: var(--c-label-primary); font-weight: 500; cursor: default; }
.crumb-sep { color: var(--c-label-caption); font-size: 14px; line-height: 20px; flex: none; }
.header-actions { flex: none; display: flex; align-items: center; gap: 4px; }
.ctx-trigger {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px;
  border-radius: 24px; color: var(--c-label-secondary); font-size: 13px; font-weight: 500; line-height: 20px;
}
.ctx-trigger:hover { background: var(--c-interactive-hover); }
.ctx-ring { position: relative; width: 18px; height: 18px; flex: none; }
.ctx-ring svg { position: absolute; inset: 0; }
.tabs { display: flex; gap: 36px; margin-top: 2px; padding-left: 8px; position: relative; z-index: 1; }
.tab {
  padding: 0 0 11px; font-size: 13px; font-weight: 500; line-height: 16px;
  color: var(--c-label-tertiary); position: relative; cursor: pointer;
}
.tab::after { content: ""; position: absolute; bottom: 1px; left: 0; right: 0; height: 2px; border-radius: 2px; background: transparent; }
.tab.active { color: var(--c-state-business); }
.tab.active::after { background: var(--c-state-business); }

.view-area { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.msg-scroll {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 16px var(--composer-clearance) 24px;
  -webkit-overflow-scrolling: touch;
}
.chat-root[data-phase="hero"] .msg-scroll { display: flex; flex-direction: column; justify-content: center; }
.msg-column { max-width: var(--chat-content-width); width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.hero-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 8px 28px; }
.hero-fish { color: var(--c-label-primary); }
.hero-headline {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  font-size: 26px; font-weight: 500; line-height: 32px; color: var(--c-label-primary);
}
.hero-badge {
  border: 1px solid var(--c-interactive-hover); background: var(--c-state-business-tertiary);
  color: #0e3074; font-family: var(--ds-font-code); white-space: nowrap;
  border-radius: 24px; padding: 1px 7px 0; font-size: 12px; font-weight: 500; line-height: 18px;
  margin-top: 2px;
}
body[data-ds-dark-theme] .hero-badge { color: var(--c-label-primary); }
.hero-ws-row { display: flex; align-items: center; gap: 2px; margin-top: 4px; }
.hero-ws {
  display: inline-flex; align-items: center; gap: 4px; max-width: min(100%, 360px);
  min-height: 28px; padding: 0 8px; border-radius: 16px; font-size: 13px; font-weight: 500;
  line-height: 20px; color: var(--c-label-primary); cursor: pointer;
}
.hero-ws:hover { background: var(--c-interactive-hover); }
.hero-ws .ic { color: var(--c-label-caption); }

/* ============ 消息 ============ */
.user-row { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.user-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 0; max-width: min(525px, 82%); }
.user-bubble {
  background: var(--c-bubble); color: var(--c-label-primary);
  border-radius: 22px; padding: 10px 16px; font-size: 16px; line-height: 24px;
  max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere;
}
.assistant-root { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.assistant-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.md { color: var(--c-label-primary); font-size: 16px; line-height: 28px; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 12px 0; }
.md h1, .md h2, .md h3, .md h4 { font-weight: 600; line-height: 1.4; margin: 20px 0 10px; }
.md h1 { font-size: 24px; } .md h2 { font-size: 22px; } .md h3 { font-size: 20px; } .md h4 { font-size: 16px; }
.md ul, .md ol { margin: 12px 0; padding-left: 24px; }
.md li { margin: 4px 0; }
.md code { font-family: var(--ds-font-code); font-size: 14px; background: var(--c-md-inline-code); border-radius: 6px; padding: 2px 6px; }
.md pre code { background: none; padding: 0; font-size: 13px; line-height: 22px; }
.md blockquote { margin: 12px 0; padding: 2px 14px; border-left: 3px solid var(--c-border-l3); color: var(--c-label-secondary); }
.md a { color: var(--c-state-business); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md table { border-collapse: collapse; margin: 12px 0; font-size: 15px; line-height: 25px; width: 100%; }
.md th, .md td { border: 1px solid var(--c-border-l2); padding: 6px 12px; text-align: left; }
.md th { font-weight: 500; background: var(--c-md-code-block); }
.md hr { border: none; border-top: 1px solid var(--c-border-l2); margin: 16px 0; }
.md .task-list-item { list-style: none; }
.md input[type="checkbox"] { margin-right: 8px; accent-color: var(--c-state-business); }
.code-block { display: flex; flex-direction: column; min-width: 0; }
.code-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--c-md-code-banner); border: 1px solid var(--c-border-l1); border-bottom: none;
  border-radius: 12px 12px 0 0; padding: 6px 12px; font-size: 12px; line-height: 18px;
}
.code-banner-lang { color: var(--c-label-tertiary); font-family: var(--ds-font-code); }
.code-banner-actions { display: flex; align-items: center; gap: 8px; }
.copy-btn {
  display: inline-flex; align-items: center; gap: 4px; color: var(--c-label-tertiary);
  font-size: 12px; line-height: 18px; border-radius: 6px; padding: 2px 6px;
}
.copy-btn:hover { background: var(--c-interactive-hover); color: var(--c-label-secondary); }
.code-pre {
  margin: 0; background: var(--c-md-code-block); border: 1px solid var(--c-border-l1);
  border-radius: 0 0 12px 12px; padding: 12px 16px; overflow-x: auto;
  font-family: var(--ds-font-code); font-size: 13px; line-height: 22px; color: var(--c-label-primary);
}
.code-pre pre { margin: 0; font-family: inherit; font-size: inherit; line-height: inherit; }
.code-pre code { font-family: inherit; }
.tok-c { color: var(--c-shiki-comment); } .tok-s { color: var(--c-shiki-string); }
.tok-k { color: var(--c-shiki-kw); } .tok-f { color: var(--c-shiki-fn); }
.tok-n { color: var(--c-shiki-num); }

/* 推理块 */
.think-root { display: flex; flex-direction: column; }
.think-row {
  position: relative; overflow: hidden; display: flex; align-items: center;
  gap: 8px; min-height: 26px; padding: 2px 0; border-radius: 6px; cursor: pointer;
}
.think-root[data-state="running"] .think-row::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 300px;
  background: linear-gradient(90deg, transparent 0%, color-mix(in srgb, var(--c-bg-base) 60%, transparent) 55%, transparent 100%);
  animation: sweep 2.6s ease-out infinite; pointer-events: none;
}
@keyframes sweep { 0% { left: -300px; } 90%, 100% { left: 100%; } }
.think-chev { color: var(--c-label-secondary); flex: none; transition: transform .12s; }
.think-root.open .think-chev { transform: rotate(90deg); }
.think-title { font-size: 14px; line-height: 24px; color: var(--c-label-primary); flex: none; }
.think-sep { width: 2px; height: 2px; border-radius: 1px; background: var(--c-label-caption); flex: none; margin: 0 8px; }
.think-summary { flex: auto; min-width: 0; color: var(--c-label-tertiary); font-size: 14px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.think-body {
  color: var(--c-label-tertiary); font-size: 14px; line-height: 24px; white-space: pre-wrap;
  word-break: break-word; padding: 4px 0 4px 22px;
}
.think-root:not(.open) .think-body { display: none; }

/* 工具调用 */
.tool-root { display: flex; flex-direction: column; }
.tool-row {
  position: relative; overflow: hidden; display: flex; align-items: center; gap: 8px;
  min-height: 26px; padding: 2px 0; border-radius: 6px; cursor: pointer;
}
.tool-root[data-state="running"] .tool-row::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 300px;
  background: linear-gradient(90deg, transparent 0%, color-mix(in srgb, var(--c-bg-base) 60%, transparent) 55%, transparent 100%);
  animation: sweep 2.6s ease-out infinite; pointer-events: none;
}
.tool-leading { flex-shrink: 0; color: var(--c-label-tertiary); display: inline-flex; align-items: center; }
.tool-root[data-tool^="cordis"] .tool-leading, .tool-root[data-tool^="cordis"] .tool-title { color: var(--c-state-business); }
.tool-root[data-tool^="cordis"] .tool-title { font-weight: 500; }
.tool-chev { color: var(--c-label-secondary); flex: none; transition: transform .12s; }
.tool-root.open .tool-chev { transform: rotate(90deg); }
.tool-title { font-size: 14px; line-height: 24px; color: var(--c-label-primary); flex: none; font-weight: 400; }
.tool-sep { width: 2px; height: 2px; border-radius: 1px; background: var(--c-label-caption); flex: none; margin: 0 8px; }
.tool-summary { flex: auto; min-width: 0; color: var(--c-label-tertiary); font-size: 14px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool-summary.error { color: var(--c-state-error); }
.tool-body-wrap { display: flex; flex-direction: column; }
.tool-root:not(.open) .tool-body-wrap { display: none; }
.io-card {
  border: 1px solid var(--c-border-l1); background: var(--c-md-code-block);
  border-radius: 12px; margin: 4px 0 4px 4px; display: flex; flex-direction: column; overflow: hidden;
}
.io-section { display: grid; grid-template-columns: max-content 1fr; align-items: baseline; column-gap: 14px; max-height: 150px; padding: 12px 16px; overflow-y: auto; }
.io-label { color: var(--c-label-caption); align-self: start; position: sticky; top: 0; font-size: 12px; line-height: 18px; }
.io-divider { background: var(--c-border-l2); height: 1px; flex: none; }
.io-text { white-space: pre-wrap; word-break: break-word; min-width: 0; color: var(--c-label-secondary); font-family: var(--ds-font-code); font-size: 12px; line-height: 18px; }
.io-text.error { color: var(--c-state-error); }
.tool-code {
  border: 1px solid var(--c-border-l1); background: var(--c-md-code-block); color: var(--c-label-primary);
  white-space: pre-wrap; word-break: break-word; border-radius: 12px; margin: 4px 0 4px 4px;
  padding: 12px 16px; font-family: var(--ds-font-code); font-size: 12px; line-height: 18px;
  max-height: 260px; overflow: auto;
}
.tool-code.error { color: var(--c-state-error); }

/* 状态行 */
.turn-status {
  display: inline-flex; align-items: center; flex: none; align-self: flex-start; height: 26px;
  font-size: 14px; font-weight: 500; line-height: 22px;
  background: linear-gradient(90deg, #4176e6 0%, #4176e6 40%, #d3e2ff 50%, #4176e6 60%, #4176e6 100%);
  background-size: 250% 100%; background-position: 100% 0;
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  animation: turn-shimmer 1.8s linear infinite;
  white-space: nowrap;
}
@keyframes turn-shimmer { to { background-position: 0 0; } }
.turn-clock { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--c-label-caption); -webkit-text-fill-color: var(--c-label-caption); margin-left: 8px; font-weight: 400; }
.stopped-chip {
  background: var(--c-interactive-hover); color: var(--c-label-tertiary); border-radius: 6px;
  align-self: flex-start; padding: 0 6px; font-size: 11px; line-height: 18px;
}

/* 统计行 */
.stats-line {
  text-align: center; width: 100%; box-sizing: border-box; padding: 4px calc(var(--composer-clearance) + 16px) 0;
  color: var(--c-label-tertiary); white-space: nowrap; text-overflow: ellipsis; margin: 0 auto;
  font-size: 12px; line-height: 20px; display: block; overflow: hidden;
}
.stats-sep { color: var(--c-sep); margin: 0 10px; }

/* 任务清单 */
.todo-root { display: flex; flex-direction: column; }
.todo-row { display: flex; align-items: center; gap: 10px; min-height: 26px; padding: 2px 0; border-radius: 6px; cursor: pointer; }
.todo-chev { color: var(--c-label-secondary); flex: none; transition: transform .12s; }
.todo-root.open .todo-chev { transform: rotate(90deg); }
.todo-title { font-size: 14px; line-height: 24px; font-weight: 500; color: var(--c-label-primary); flex: none; }
.todo-progress { flex: auto; min-width: 0; color: var(--c-label-tertiary); font-size: 13px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.todo-body { display: flex; flex-direction: column; gap: 8px; max-height: 180px; padding: 6px 0 2px 18px; overflow-y: auto; }
.todo-root:not(.open) .todo-body { display: none; }
.todo-item { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--c-label-secondary); font-size: 13px; line-height: 20px; }
.todo-glyph { flex: none; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; }
.todo-glyph.done { color: var(--c-state-success); }
.todo-glyph.pending { color: var(--c-label-caption); }
.todo-glyph.progress { color: var(--c-state-business); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.todo-text { flex: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 审批卡片 */
.approval-card {
  width: 100%; max-width: var(--chat-content-width); border: 1px solid var(--c-state-warn-secondary);
  background: var(--c-input-major); box-shadow: var(--shadow-lv2); border-radius: 20px; overflow: hidden;
}
.approval-strip {
  background: var(--c-state-warn-tertiary); color: var(--c-state-warn-primary);
  display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13px; line-height: 18px;
}
.approval-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-state-warn-primary); flex: none; }
.approval-body { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 0; max-height: var(--composer-text-max-height); overflow-y: auto; }
.approval-headline { color: var(--c-label-primary); font-size: 15px; font-weight: 500; line-height: 24px; }
.approval-command { color: var(--c-label-tertiary); font-family: var(--ds-font-code); word-break: break-all; font-size: 13px; line-height: 20px; }
.approval-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 16px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 14px; border-radius: 10px; font-size: 13px; font-weight: 500; line-height: 20px;
  transition: background .1s, color .1s, border-color .1s;
}
.btn-outline { border: 1px solid var(--c-border-l2); color: var(--c-label-secondary); }
.btn-outline:hover { background: var(--c-interactive-hover); color: var(--c-label-primary); }
.btn-primary { background: var(--c-button-primary-fill); color: var(--c-label-primary-foreground, #fff); }
body[data-ds-dark-theme] .btn-primary { color: #151517; }
.btn-primary:hover { background: var(--c-button-primary-hover); }
.btn-danger-outline:hover { background: var(--c-interactive-hover-danger); color: var(--c-state-error); border-color: transparent; }

/* 回到底部 */
.to-bottom {
  position: absolute; right: 16px; bottom: 132px; z-index: 8;
  width: 34px; height: 34px; display: none; align-items: center; justify-content: center;
  border: 1px solid var(--c-border-l2); background: var(--c-button-floating-fill);
  box-shadow: var(--shadow-lv2); border-radius: 100px; color: var(--c-label-primary);
}
.to-bottom.show { display: flex; }
.to-bottom:active { background: var(--c-button-floating-hover); }

/* ============ Composer ============ */
.composer-seat {
  flex: none; z-index: 7; position: relative;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c-bg-base) 0%, transparent) 0px, var(--c-bg-base) 36px);
  padding: 0 var(--composer-clearance) calc(8px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center;
}
.composer-dock { width: 100%; max-width: var(--composer-card-max-width); display: flex; flex-direction: column; gap: 6px; }
.composer-card {
  box-sizing: border-box; width: 100%; max-width: var(--composer-card-max-width);
  border: 1px solid var(--c-border-l2-thin); background: var(--c-input-major);
  box-shadow: var(--shadow-lv2); border-radius: 22px; display: flex; flex-direction: column; gap: 8px;
  padding-top: 10px; font-size: 16px; line-height: 24px; position: relative;
}
.composer-accessory { display: flex; align-items: center; gap: 8px; padding: 0 12px; flex-wrap: wrap; }
.attach-chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
  background: var(--c-interactive-hover); border-radius: 14px; color: var(--c-label-secondary); font-size: 12px; line-height: 18px;
}
.attach-chip .ic { color: var(--c-label-tertiary); }
.attach-chip button { color: var(--c-label-caption); width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; }
.composer-grow { position: relative; min-height: 40px; }
.composer-input {
  display: block; width: 100%; min-height: 40px; max-height: var(--composer-text-max-height);
  resize: none; border: none; outline: none; background: transparent;
  padding: 8px 16px 4px; font-size: 16px; line-height: 24px; color: var(--c-label-primary);
  overflow-y: auto;
}
.composer-input::placeholder { color: var(--c-label-caption); user-select: none; }
.composer-row {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
  min-width: 0; padding: 0 8px 8px; container-type: inline-size;
}
.tool-btns, .mode-btns, .trailing { display: flex; align-items: center; min-width: 0; }
.tool-btns { gap: 14px; }
.mode-btns { gap: 12px; }
.trailing { flex: none; gap: 12px; }
.tool-btn {
  display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px;
  border-radius: 8px; color: var(--c-label-secondary); font-size: 13px; font-weight: 500; line-height: 20px;
  white-space: nowrap;
}
.tool-btn:hover { background: var(--c-interactive-hover); }
.tool-btn .ic { color: var(--c-label-tertiary); }
.model-trigger {
  display: inline-flex; align-items: center; gap: 4px; max-width: 200px; height: 28px;
  padding: 0 4px 0 8px; border-radius: 24px; color: var(--c-label-secondary);
  font-size: 13px; font-weight: 500; line-height: 20px; white-space: nowrap;
}
.model-trigger:hover { background: var(--c-interactive-hover); }
.model-trigger .ic { color: var(--c-state-business); flex: none; }
.model-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-chev { color: var(--c-label-caption); flex: none; transition: transform .12s; }
.model-trigger.open .model-chev { transform: rotate(180deg); }
.send-btn {
  width: 34px; height: 34px; flex: none; display: grid; place-items: center;
  background: var(--c-button-info-fill); color: #fff; border-radius: 999px;
  transform: translateY(-2px); transition: background .1s;
}
.send-btn:hover { background: var(--c-button-info-hover); }
.send-btn:disabled { opacity: .4; cursor: default; }
.send-btn.running { background: transparent; color: var(--c-label-primary); border: 1.5px solid var(--c-border-l3); }
.send-btn.running:hover { background: var(--c-interactive-hover); }
.composer-hint { text-align: center; color: var(--c-label-caption); font-size: 11px; line-height: 16px; padding: 4px 0 0; max-width: 100%; }

/* 目标卡 */
.goal-card {
  width: 100%; border: 1px solid var(--c-state-warn-secondary); background: var(--c-input-major);
  box-shadow: var(--shadow-lv2); border-radius: 20px; overflow: hidden;
}
.goal-strip {
  background: var(--c-state-warn-tertiary); color: var(--c-state-warn-primary);
  display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13px; line-height: 18px;
}
.goal-body { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 14px; }
.goal-headline { color: var(--c-label-primary); font-size: 15px; font-weight: 500; line-height: 24px; }
.goal-actions { display: flex; gap: 8px; margin-top: 4px; }
.goal-chip {
  display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px;
  background: var(--c-interactive-hover); color: var(--c-label-secondary); font-size: 12px; line-height: 18px;
}
.goal-chip:hover { background: var(--c-interactive-hover-solid); }

/* ============ 弹出层（portal） ============ */
.overlay-backdrop { position: fixed; inset: 0; z-index: 40; }
.popup {
  position: fixed; z-index: 50; box-sizing: border-box;
  border: 1px solid var(--c-border-inverted); background: var(--c-menu);
  box-shadow: var(--shadow-lv3); color: var(--c-label-primary);
  border-radius: 12px; font-size: 13px; line-height: 20px;
  animation: pop-in .12s var(--ds-ease);
  max-height: min(420px, 100vh - 96px); overflow: hidden; display: flex; flex-direction: column;
}
@keyframes pop-in { from { opacity: 0; transform: translateY(4px); } }
.popup-header { padding: 12px 14px 6px; font-size: 13px; font-weight: 500; line-height: 20px; color: var(--c-label-primary); }
.popup-scroll { overflow-y: auto; padding: 4px; }
.popup-scroll.no-pad { padding: 0; }
.popup-section + .popup-section { margin-top: 4px; }
.popup-section-title {
  position: sticky; top: 0; z-index: 1; background: var(--c-menu);
  color: var(--c-label-tertiary); padding: 5px 8px 3px; font-size: 12px; font-weight: 500; line-height: 18px;
}
.popup-option {
  width: 100%; display: flex; align-items: center; gap: 8px; min-height: 38px;
  padding: 6px 8px; border-radius: 10px; text-align: left; cursor: pointer;
}
.popup-option:hover { background: var(--c-interactive-hover); }
.popup-option:disabled { color: var(--c-label-dimmed); cursor: default; }
.popup-option-copy { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.popup-option-name { font-size: 14px; font-weight: 500; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.popup-option-desc { font-size: 12px; line-height: 18px; color: var(--c-label-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.popup-option-check { flex: 0 0 18px; display: grid; place-items: center; color: var(--c-label-primary); }
.popup-row {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px;
  padding: 6px 10px; border-radius: 8px; text-align: left; cursor: pointer; font-size: 13px; line-height: 20px;
  color: var(--c-label-primary);
}
.popup-row:hover { background: var(--c-interactive-hover); }
.popup-row .ic { color: var(--c-label-secondary); flex: none; }
.popup-row.danger { color: var(--c-state-error); }
.popup-row.danger .ic { color: var(--c-state-error); }
.popup-divider { height: 1px; background: var(--c-border-l1); margin: 4px 8px; }
.popup-status { padding: 10px; color: var(--c-label-tertiary); font-size: 13px; line-height: 20px; }

/* 上下文仪表 */
.ctx-popup { width: 264px; }
.ctx-header { display: flex; align-items: center; gap: 6px; padding: 12px 14px 6px; }
.ctx-headline { color: var(--c-label-tertiary); font-size: 12px; line-height: 20px; }
.ctx-figures { font-variant-numeric: tabular-nums; color: var(--c-label-primary); margin-left: auto; font-weight: 500; font-size: 12px; }
.ctx-percent { color: var(--c-label-primary); font-weight: 500; font-size: 12px; }
.ctx-bar { background: var(--c-interactive-hover); border-radius: 999px; gap: 1px; height: 4px; margin: 8px 14px 12px; display: flex; overflow: hidden; }
.ctx-seg { border-radius: 1px; flex: none; min-width: 2px; height: 100%; }
.ctx-rows { margin: 0 6px 6px; padding: 0; }
.ctx-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 8px; font-size: 12px; line-height: 18px; }
.ctx-row dt { color: var(--c-label-secondary); }
.ctx-row dd { font-variant-numeric: tabular-nums; color: var(--c-label-primary); margin: 0; }
.ctx-swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }

/* 统计 popup */
.stats-popup { width: 280px; }
.stats-popup .popup-header { display: flex; align-items: baseline; gap: 8px; }
.stats-headline { color: var(--c-label-tertiary); font-size: 12px; font-weight: 400; }
.stats-figures { font-variant-numeric: tabular-nums; color: var(--c-label-primary); font-weight: 500; font-size: 13px; margin-left: auto; }
.stats-rows { margin: 4px 6px 6px; }
.stats-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 3px 8px; font-size: 12px; line-height: 18px; }
.stats-row dt { color: var(--c-label-secondary); }
.stats-row dd { font-variant-numeric: tabular-nums; color: var(--c-label-primary); margin: 0; }
.stats-meter { display: flex; gap: 1px; height: 4px; border-radius: 999px; overflow: hidden; margin: 8px 14px 4px; background: var(--c-interactive-hover); }
.stats-meter i { display: block; height: 100%; }

/* ============ 详情面板 / 底部弹层 ============ */
.details-panel {
  height: 100%; display: flex; flex-direction: column; background: var(--c-bg-base);
}
.details-header {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; border-bottom: 1px solid var(--c-border-l2);
}
.details-title { font-size: 14px; font-weight: 500; line-height: 20px; color: var(--c-label-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.details-body { flex: 1; min-height: 0; padding: 12px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.details-empty { color: var(--c-label-tertiary); padding: 8px 0; font-size: 13px; line-height: 20px; }
.details-section-label { color: var(--c-label-secondary); margin-bottom: 6px; font-size: 12px; font-weight: 500; line-height: 18px; }
.details-code {
  background: var(--c-md-code-block); font-family: var(--ds-font-code); color: var(--c-label-primary);
  white-space: pre-wrap; word-break: break-word; border-radius: 12px; padding: 16px; font-size: 13px; line-height: 22px; max-height: 300px; overflow: auto;
}
.details-code.error { color: var(--c-state-error); }
.sheet-backdrop { position: fixed; inset: 0; background: var(--c-bg-mask-1, rgba(0,0,0,.24)); z-index: 60; animation: fade-in .15s var(--ds-ease); }
@keyframes fade-in { from { opacity: 0; } }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;
  background: var(--c-bg-layer-1); border-radius: 20px 20px 0 0;
  max-height: 72vh; display: flex; flex-direction: column;
  animation: sheet-in .25s var(--ds-ease);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@keyframes sheet-in { from { transform: translateY(100%); } }
.sheet-grab { width: 36px; height: 4px; border-radius: 2px; background: var(--c-border-l3); margin: 8px auto 4px; flex: none; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; }

/* ============ Toast ============ */
.toast-wrap { position: fixed; left: 0; right: 0; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {
  background: var(--c-toast-bg); color: #fff; border-radius: 999px; padding: 8px 16px;
  font-size: 13px; line-height: 18px; box-shadow: var(--shadow-lv3);
  animation: toast-in .2s var(--ds-ease);
  max-width: 84vw; text-align: center;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
.toast.out { opacity: 0; transition: opacity .2s; }

/* 会话摘要 / 上下文块 */
.ctx-chip-row { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 2px 0; }
.ctx-chip-title { color: var(--c-label-primary-dimmed); flex: none; font-size: 14px; line-height: 24px; }
.ctx-chip-sep { width: 2px; height: 2px; border-radius: 1px; background: var(--c-label-caption); flex: none; margin: 0 8px; }
.ctx-chip-summary { min-width: 0; color: var(--c-label-tertiary); text-overflow: ellipsis; white-space: nowrap; flex: auto; font-size: 14px; line-height: 24px; overflow: hidden; }
.ctx-chip-btn { display: flex; align-items: center; width: 100%; min-width: 0; height: 24px; padding: 0; border-radius: 6px; background: none; text-align: left; font: inherit; color: inherit; }
.ctx-chip-btn:hover { background: var(--c-interactive-hover); }
.ctx-chip-chev { color: var(--c-label-secondary); flex: none; transition: transform .12s; }
.ctx-chip-root.open .ctx-chip-chev { transform: rotate(90deg); }
.ctx-chip-body { color: var(--c-label-tertiary); padding: 4px 0 4px 22px; font-size: 14px; line-height: 24px; white-space: pre-wrap; word-break: break-word; }
.ctx-chip-root:not(.open) .ctx-chip-body { display: none; }

/* 工作区 Tab */
.ws-view { display: flex; flex-direction: column; gap: 4px; }
.ws-file-row {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px;
  padding: 6px 10px; border-radius: 10px; cursor: pointer; text-align: left;
}
.ws-file-row:hover { background: var(--c-interactive-hover); }
.ws-file-ic { color: var(--c-label-tertiary); flex: none; }
.ws-file-copy { flex: 1; min-width: 0; }
.ws-file-name { font-size: 14px; line-height: 20px; color: var(--c-label-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-file-meta { font-size: 12px; line-height: 17px; color: var(--c-label-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-file-action { color: var(--c-label-caption); flex: none; }
.ws-notice { color: var(--c-label-tertiary); font-size: 12px; line-height: 18px; padding: 8px 4px; }

/* 移动端输入键盘优化 */
@media (max-width: 1023px) {
  .chat-header { padding-left: 14px; padding-right: 14px; }
  .crumb { max-width: 120px; }
  .ctx-trigger span.ctx-label { display: none; }
  .tool-btn span { display: none; }
  .tool-btns { gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div id="app" class="frame">
  <aside class="sidebar-col rail-mode" id="sidebarCol">
    <!-- 宽侧栏 -->
    <nav class="sidebar-root" id="sidebarRoot">
      <div class="logo-row">
        <button class="brand" data-action="new-session" title="新建会话">
          <span class="wordmark">
            <span class="wordmark-fish ic" id="brandFish"></span>
            <span class="wordmark-text">DeepSeek Harness</span>
          </span>
        </button>
        <button class="icon-btn" data-action="toggle-sidebar" title="收起侧边栏" id="toggleBtnWide"></button>
      </div>
      <button class="new-session" data-action="new-session"><span class="ic" id="newChatIcon"></span>新会话</button>
      <div class="region-area">
        <div class="search-box"><span class="ic" id="searchIcon"></span><input id="wsSearch" type="text" placeholder="搜索会话…" autocomplete="off" spellcheck="false" /></div>
        <div class="sec-label">工作区</div>
        <div class="ws-scroll" id="wsScroll"></div>
      </div>
      <div class="foot-area">
        <button class="foot-row-btn" data-action="theme"><span class="ic" id="themeIconWide"></span><span id="themeLabelWide">浅色模式</span></button>
      </div>
    </nav>
    <!-- 窄 rail -->
    <nav class="rail-root" id="railRoot">
      <button class="rail-btn fish" data-action="toggle-sidebar" title="打开侧边栏"><span class="ic" id="railFish"></span></button>
      <button class="rail-btn" data-action="new-session" title="新建会话"><span class="ic" id="railNew"></span></button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" data-action="theme" title="切换主题"><span class="ic" id="railTheme"></span></button>
    </nav>
  </aside>

  <main class="center-col">
    <section class="chat-root" id="chatRoot" data-phase="hero">
      <header class="chat-header">
        <div class="title-row">
          <div class="crumbs" id="crumbs"></div>
          <div class="header-actions">
            <button class="icon-btn" data-action="more" title="更多操作"><span class="ic" id="moreIcon"></span></button>
          </div>
        </div>
        <div class="tabs">
          <button class="tab active" data-tab="chat">对话</button>
        </div>
      </header>
      <div class="view-area" id="viewArea">
        <div class="msg-scroll" id="msgScroll">
          <div class="msg-column" id="msgColumn"></div>
        </div>
        <div class="composer-seat" id="composerSeat">
          <div class="composer-dock" id="composerDock"></div>
          <div class="composer-card" id="composerCard">
            <div class="composer-accessory hidden" id="composerAccessory"></div>
            <div class="composer-grow">
              <textarea class="composer-input" id="composerInput" rows="1" placeholder="描述你想要构建的内容" enterkeyhint="send"></textarea>
            </div>
            <div class="composer-row">
              <div class="tool-btns">
                <button class="tool-btn" data-action="attach" title="添加图片"><span class="ic" id="attachIcon"></span><span>图片</span></button>
                <button class="tool-btn" data-action="commands" title="命令"><span class="ic" id="cmdIcon"></span><span>命令</span></button>
                <button class="tool-btn" data-action="skills" title="技能"><span class="ic" id="skillIcon"></span><span>技能</span></button>
              </div>
              <div class="mode-btns">
                <button class="model-trigger" id="modelTrigger" data-action="model"><span class="ic" id="modelSparkIcon"></span><span class="model-label" id="modelLabel">deepseek-chat</span><span class="ic model-chev" id="modelChev"></span></button>
              </div>
              <div class="trailing">
                <button class="send-btn" id="sendBtn" title="发送消息" aria-label="发送消息"></button>
              </div>
            </div>
          </div>
          <div class="composer-hint hidden" id="composerHint">Cmd/Ctrl+Enter 插话发送全部排队消息</div>
        </div>
      </div>
    </section>
  </main>

  <aside class="details-col" id="detailsCol"></aside>
  <div class="to-bottom" id="toBottom" title="回到底部"></div>
</div>

<div id="portal"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
   DeepSeek Harness WebUI 复刻 — 真实网关交互版
   使用 DSH /api RPC + WebSocket 事件流，替换原纯前端演示逻辑。
   ============================================================ */
(function () {
  'use strict';

  /* ---------- 基础工具 ---------- */
  const $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function ic(name, size) {
    const svg = window.DSH_ICONS && window.DSH_ICONS[name];
    if (!svg) return '';
    const s = size || 16;
    return svg.replace('<svg ', '<svg width="' + s + '" height="' + s + '" ');
  }
  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }
  let toastTimer = null;
  function toast(msg, ms) {
    const wrap = $('toastWrap');
    if (!wrap) return;
    const t = el('<div class="toast">' + esc(msg) + '</div>');
    wrap.appendChild(t);
    setTimeout(function () { t.classList.add('out'); }, (ms || 2600) - 300);
    setTimeout(function () { t.remove(); }, ms || 2600);
  }
  function relTime(t) {
    if (!t) return '';
    const d = Date.now() - t;
    if (d < 60000) return '刚刚';
    if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
    if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
    return Math.floor(d / 86400000) + ' 天前';
  }
  function clock(t) {
    if (!t) return '';
    const dt = new Date(t);
    const p = function (n) { return String(n).padStart(2, '0'); };
    return dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate()) + ' ' + p(dt.getHours()) + ':' + p(dt.getMinutes());
  }
  function textOf(content) {
    if (!Array.isArray(content)) return '';
    return content.filter(function (b) { return b && b.type === 'text' && typeof b.text === 'string'; }).map(function (b) { return b.text; }).join('\n');
  }
  function uuid() {
    if (typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    const h = Array.from(b, function (x) { return x.toString(16).padStart(2, '0'); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }

  /* ---------- 主题 ---------- */
  const THEME_KEY = 'dsh-replica-theme';
  let themePref = 'light';
  try { themePref = localStorage.getItem(THEME_KEY) || 'light'; } catch (e) { /* ignore */ }
  function resolveDark() {
    if (themePref === 'dark') return true;
    if (themePref === 'system') return window.matchMedia('(prefers-color-scheme: dark)').matches;
    return false;
  }
  function applyTheme() {
    const dark = resolveDark();
    document.body.toggleAttribute('data-ds-dark-theme', dark);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = dark ? '#151517' : '#f9fafb';
    renderThemeIcons();
  }
  function renderThemeIcons() {
    const dark = resolveDark();
    const sun = ic('IconLightOutline16', 16), moon = ic('IconDarkOutline16', 16);
    setIcon('themeIconWide', dark ? sun : moon);
    setIcon('railTheme', dark ? sun : moon);
    const label = $('themeLabelWide');
    if (label) label.textContent = dark ? '深色模式' : '浅色模式';
  }
  function setIcon(id, svg) {
    const node = $(id);
    if (node) node.innerHTML = svg;
  }
  function cycleTheme() {
    themePref = themePref === 'light' ? 'dark' : themePref === 'dark' ? 'system' : 'light';
    try { localStorage.setItem(THEME_KEY, themePref); } catch (e) { /* ignore */ }
    applyTheme();
    toast('主题：' + (themePref === 'dark' ? '深色' : themePref === 'system' ? '跟随系统' : '浅色'));
  }

  /* ---------- 应用状态 ---------- */
  let currentId = null;
  let currentTab = 'chat'; // chat | jobs | ws
  let listItems = [];
  let workspaces = [];
  const wsById = new Map();
  let archivedIds = new Set();
  let groupsSnap = [];
  let wsOpen = new Map();
  const sessions = new Map();
  const pendApprovals = new Map();
  const pendQuestions = new Map();
  let wsMux = null, wsHost = null, muxRetry = 0, hostRetry = 0;
  let stickBottom = true;
  let presetRoster = null;
  let aSnap = [];
  let qSnap = [];
  let sheetView = null;
  let resyncTimer = null;
  let loadingMore = false;
  function openSheet(v) { sheetView = v; }
  function closeSheet() { sheetView = null; }
  function renderSheet() {}

  /* ---------- RPC ---------- */
  async function rpc(method, payload) {
    const env = { type: 'client-request', rpcId: uuid(), method, payload };
    const resp = await fetch('/api/' + method, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(env),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const full = await resp.json();
    if (!full || full.type !== 'server-response') throw new Error('响应格式异常');
    if (!full.result || !full.result.ok) {
      const e = full.result && full.result.error;
      throw new Error((e && e.message) || (e && e.code) || 'RPC 失败');
    }
    return full.result.value;
  }
  async function respond(rpcId, result) {
    const resp = await fetch('/api/respond', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ type: 'client-response', rpcId, result }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return resp.json();
  }

  /* ---------- 会话模型 ---------- */
  function ensureSession(id) {
    let s = sessions.get(id);
    if (!s) {
      s = { sessionId: id, nodes: [], drafts: new Map(), userIds: new Set(), lastSeq: 0, firstSeq: undefined, foldCursor: -1, eventsBySeq: new Map(), jobs: [], queue: [], running: false, title: null, updatedAt: 0, blank: false, hasMore: false, renderedCount: 0, dirtyNodes: new Set(), agentPreset: null, models: null, subscribedLastSeq: 0 };
      sessions.set(id, s);
    }
    return s;
  }
  function ingestEvent(sess, ev, viewInfo) {
    if (!ev || typeof ev.seq !== 'number') return false;
    if (sess.eventsBySeq.has(ev.seq)) return false;
    sess.eventsBySeq.set(ev.seq, { event: ev, view: viewInfo });
    if (sess.firstSeq === undefined || ev.seq < sess.firstSeq) sess.firstSeq = ev.seq;
    if (ev.seq > sess.lastSeq) sess.lastSeq = ev.seq;
    return true;
  }
  function foldNew(sess) {
    const seqs = Array.from(sess.eventsBySeq.keys()).filter(function (s) { return s > sess.foldCursor; }).sort(function (a, b) { return a - b; });
    for (const seq of seqs) foldOne(sess, sess.eventsBySeq.get(seq));
    if (seqs.length) sess.foldCursor = seqs[seqs.length - 1];
  }
  function resetFold(sess) {
    sess.nodes = [];
    sess.drafts.clear();
    sess.userIds.clear();
    sess.foldCursor = -1;
    foldNew(sess);
  }
  function foldOne(sess, entry) {
    const ev = entry.event;
    switch (ev.type) {
      case 'user/message': {
        const id = ev.data && ev.data.id != null ? String(ev.data.id) : null;
        if (id && sess.userIds.has(id)) return;
        if (id) sess.userIds.add(id);
        const text = textOf(ev.data && ev.data.content);
        if (!text) return;
        sess.nodes.push({ kind: 'user', text: text, time: ev.time, seq: ev.seq });
        break;
      }
      case 'assistant/chunk': {
        const key = ((ev.data && ev.data.turn) ?? 0) + ':' + ((ev.data && ev.data.step) ?? 0);
        let draft = sess.drafts.get(key);
        if (!draft) {
          draft = { kind: 'assistant', text: '', tools: [], reasoning: '', time: ev.time, live: true, seq: ev.seq };
          sess.drafts.set(key, draft);
          sess.nodes.push(draft);
        }
        const c = ev.data && ev.data.chunk;
        if (c && c.type === 'text-delta' && typeof c.text === 'string') draft.text += c.text;
        else if (c && c.type === 'block-end' && c.block && c.block.type === 'text' && typeof c.block.text === 'string') draft.text = c.block.text;
        draft.time = ev.time;
        const di = sess.nodes.indexOf(draft);
        if (di >= 0) sess.dirtyNodes.add(di);
        break;
      }
      case 'assistant/message': {
        if (ev.surfaceOp !== 'append') return;
        const key = ((ev.data && ev.data.turn) ?? 0) + ':' + ((ev.data && ev.data.step) ?? 0);
        const blocks = (ev.data && ev.data.message && Array.isArray(ev.data.message.content)) ? ev.data.message.content : [];
        const node = { kind: 'assistant', text: '', tools: [], reasoning: '', time: ev.time, live: false, seq: ev.seq };
        for (const b of blocks) {
          if (!b) continue;

          else if (b.type === 'reasoning' && typeof b.text === 'string') node.reasoning += b.text;

  /* ---------- 会话列表 ---------- */

    for (const w of wsSorted) {
      const items = listItems.filter(function (it) { return (w.sessionIds || []).includes(it.sessionId) && !archivedIds.has(it.sessionId) && !hiddenBlank(it); });
      for (const it of items) used.add(it.sessionId);

  /* ---------- WebSocket ---------- */
  function connectMux() {
    const url = new URL('/api/events.mux', location.href);
    url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    try { wsMux = new WebSocket(url); } catch (e) { scheduleMux(); return; }
    wsMux.onopen = function () { muxRetry = 0; scheduleResync(); };

      try {
        const env = JSON.parse(e.data);
        if (env && env.type === 'server-request' && env.payload) handleMuxFrame(env, env.payload);
      } catch (_) {}
    };
    wsMux.onclose = function () { scheduleMux(); };
    wsMux.onerror = function () {};
  }

    const delay = Math.min(1000 * Math.pow(2, muxRetry++), 15000);
    setTimeout(connectMux, delay);
  }

    const url = new URL('/api/events.host', location.href);
    url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    try { wsHost = new WebSocket(url); } catch (e) { scheduleHost(); return; }
    wsHost.onopen = function () { hostRetry = 0; };
    wsHost.onmessage = function (e) {
      try {
        const env = JSON.parse(e.data);

  function handleMuxFrame(env, frame) {
    switch (frame.type) {
      case 'session/event': {
        const s = sessions.get(frame.sessionId);
        if (s && ingestEvent(s, frame.event, frame.view)) {
          if (currentId === frame.sessionId) {
            foldNew(s);
            renderChatLight();
          }
        }
        break;
      }
      case 'session/projection': {
        const s = sessions.get(frame.sessionId);
        if (s && frame.key === 'title' && typeof frame.value === 'string' && frame.value.trim()) {
          s.title = frame.value;
          if (currentId === frame.sessionId) renderHeader();
          renderSidebar();
        }

      }
      case 'session/subscribed': {

      }
      case 'stream/error': {

        else renderSidebar();
        break;
      }
      case 'question/requested': {
        pendQuestions.set(env.rpcId, { rpcId: env.rpcId, frame: frame });
        if (currentId === frame.sessionId) openQuestions();
        else renderSidebar();
        break;
      }
      case 'question/resolved': {

        if (currentId === frame.sessionId) renderChatLight();
        else renderSidebar();
        break;
      }
      case 'session/queue': {
        const s = ensureSession(frame.sessionId);
        s.queue = frame.items || [];

        break;
      }
      case 'session/jobs': {
        const s = ensureSession(frame.sessionId);
        s.jobs = frame.jobs || [];

  /* ---------- Markdown 渲染（保留原复刻 UI 视觉） ---------- */
  function highlight(code, lang) {
    let s = esc(code);
    s = s.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*)/g, '<span class="tok-c">$1</span>');
    s = s.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)/g, '<span class="tok-s">$1</span>');
    s = s.replace(/\b(function|const|let|var|return|import|export|from|if|else|for|while|async|await|new|class|extends|type|interface|enum|of|in|typeof|void|throw|try|catch|finally|switch|case|default|public|private|protected|static|readonly|keyof|this|true|false|null|undefined|def|lambda|with|as|match)\b/g, '<span class="tok-k">$1</span>');
    s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-n">$1</span>');
    return s;
  }
  function renderInline(t) {
    let s = esc(t);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

    return s;
  }
  function renderMarkdown(md) {

    function closeList() {
      if (inList) { html += '</' + listType + '>'; inList = false; }
    }
    function closeTable() {
      if (inTable) {
        html += '<table>' + tableBuf.join('') + '</table>';
        tableBuf = []; inTable = false;
      }
    }
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        if (!inCode) { closeList(); closeTable(); inCode = true; codeLang = fence[1] || ''; codeBuf = []; }
        else {
          const code = codeBuf.join('\n');
          html += codeBlockHtml(code, codeLang);
          inCode = false;
        }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }
      if (/^\s*$/.test(line)) { closeList(); closeTable(); html += '<p></p>'; continue; }

        if (!inTable) { closeList(); inTable = true; tableBuf = ['<thead><tr>']; }
        const cells = line.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return renderInline(c.trim()); });
        tableBuf.push('<th>' + cells.join('</th><th>') + '</th>');
        tableBuf.push('</tr></thead><tbody><tr>');
        i += 1;
        continue;
      }
      if (inTable) {
        if (!line.trim().startsWith('|')) { closeTable(); }
        else {
          const cells = line.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return renderInline(c.trim()); });
          tableBuf.push('<td>' + cells.join('</td><td>') + '</td>');
          tableBuf.push('</tr><tr>');
          continue;
        }
      }
      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { closeList(); closeTable(); const lv = h[1].length; html += '<h' + lv + '>' + renderInline(h[2]) + '</h' + lv + '>'; continue; }
      const li = line.match(/^\s*([-*+]|\d+\.)\s+(.*)$/);
      if (li) {
        const t = li[1] === '-' || li[1] === '*' || li[1] === '+' ? 'ul' : 'ol';
        const task = li[2].match(/^\[([ xX])\]\s+(.*)$/);
        if (!inList || listType !== t) { closeList(); inList = true; listType = t; html += '<' + t + '>'; }
        if (task) {
          const checked = task[1].toLowerCase() === 'x';
          html += '<li class="task-list-item"><input type="checkbox" disabled ' + (checked ? 'checked' : '') + '/>' + renderInline(task[2]) + '</li>';
        } else {
          html += '<li>' + renderInline(li[2]) + '</li>';
        }
        continue;
      }
      closeList();
      if (line.startsWith('> ')) {
        html += '<blockquote>' + renderInline(line.slice(2)) + '</blockquote>';
        continue;
      }
      if (/^(-{3,}|\*{3,})$/.test(line.trim())) { html += '<hr/>'; continue; }
      html += '<p>' + renderInline(line) + '</p>';
    }
    closeList(); closeTable();
    if (inCode) html += codeBlockHtml(codeBuf.join('\n'), codeLang);
    return html;
  }
  function codeBlockHtml(code, lang) {
    const content = highlight(code, lang);
    return '<div class="code-block">' +
      '<div class="code-banner"><span class="code-banner-lang">' + esc(lang || 'code') + '</span>' +
      '<span class="code-banner-actions"><button class="copy-btn" data-copy="' + encodeURIComponent(code) + '">' + ic('IconCopyOutline16', 13) + '复制</button></span></div>' +
      '<pre class="code-pre"><code>' + content + '</code></pre></div>';
  }

  /* ---------- 消息块渲染 ---------- */
  function blockHtml(b) {

      case 'approval':
        return '<div class="approval-card"><div class="approval-strip"><span class="approval-dot"></span><span>工具 ' + esc(b.toolName) + ' 请求越权执行</span></div><div class="approval-body"><div class="approval-headline">运行以下命令需要额外授权：</div><div class="approval-command">' + esc(b.command) + '</div></div><div class="approval-actions"><button class="btn btn-outline btn-danger-outline" data-approval="reject">拒绝</button><button class="btn btn-primary" data-approval="allow">允许一次</button></div></div>';
      case 'ctxChip': {
        const open = b.open ? ' open' : '';
        return '<div class="ctx-chip-root' + open + '" data-toggle="ctxchip"><button class="ctx-chip-btn"><span class="ic ctx-chip-chev">' + ic('IconChevronRightOutline14', 12) + '</span><span class="ic ctx-chip-title-ic">' + ic('IconArchiveOutline20', 14) + '</span><span class="ctx-chip-title">' + esc(b.title) + '</span><span class="ctx-chip-sep"></span><span class="ctx-chip-summary">' + esc(b.summary || '') + '</span></button><div class="ctx-chip-body">' + esc(b.body || '') + '</div></div>';

  function toolBodyHtml(b) {

  /* ---------- 状态点 / 图标 ---------- */

  /* ---------- 渲染：消息 / 任务 / 工作区 ---------- */
  function pendingHtml() {

  function nodeHtml(n, i) {

      if (n.reasoning) inner += blockHtml({ t: 'think', state: n.live ? 'running' : 'done', summary: (n.reasoning || '').replace(/\s+/g, ' ').slice(0, 60), body: n.reasoning, open: false });

      for (const t of n.tools || []) {
        inner += blockHtml({ t: 'tool', name: t.name, tool: t.name, icon: 'IconCodeOutline16', state: 'done', summary: String(t.args || '').slice(0, 120), input: String(t.args || ''), output: '', open: false });
      }

      inner = blockHtml({ t: 'tool', name: '工具结果', tool: 'result', icon: 'IconCodeOutline16', state: 'done', summary: (n.body || '').replace(/\s+/g, ' ').slice(0, 80), input: '', output: n.body, open: false });

  function renderMessages(keepScroll) {

    portal.innerHTML = '<div class="overlay-backdrop" data-close-popup></div><div class="popup">' + html + '</div>';
    const popup = portal.querySelector('.popup');
    if (!popup || !rect) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    popup.style.maxWidth = 'min(320px, calc(100vw - 32px))';
    popup.style.visibility = 'hidden';
    document.body.appendChild(popup);
    const pw = popup.offsetWidth, ph = popup.offsetHeight;
    document.body.removeChild(popup);
    portal.appendChild(popup);
    popup.style.visibility = '';
    let left = Math.max(8, Math.min(rect.right - pw, vw - pw - 8));
    let top = rect.top - ph - 8;
    if (top < 8) top = Math.min(rect.bottom + 8, vh - ph - 8);
    if (top < 8) { top = 8; popup.style.maxHeight = (vh - 16) + 'px'; }
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

        (it.icon ? '<span class="ic">' + ic(it.icon, 15) + '</span>' : '') +
        '<span>' + esc(it.label) + '</span></button>';
    }
    html += '</div>';
    return html;
  }

  /* ---------- 会话操作 ---------- */
  async function renameSession() {
    if (!currentId) return;
    const s = sessions.get(currentId);
    const title = prompt('重命名会话', s && s.title ? s.title : '');
    if (title && title.trim()) {
      try {
        await rpc('session.rename', { sessionId: currentId, title: title.trim() });
        if (s) s.title = title.trim();
        toast('已重命名');
        renderAll();
        refreshList();
      } catch (e) { toast('重命名失败: ' + e.message); }
    }
  }
  async function archiveSession() {
    if (!currentId) return;
    if (!confirm('确定归档当前会话？电脑端可恢复。')) return;
    try {
      await rpc('workspace.archiveSession', { sessionId: currentId });
      toast('已归档');
      currentId = null;
      await refreshList();
      renderAll();
    } catch (e) { toast('归档失败: ' + e.message); }
  }
  function sendCommand(cmd) {
    const input = $('composerInput');
    if (!input) return;
    input.value = cmd.startsWith('/skill') ? cmd : '/' + cmd;
    autoGrow(input);
    if (currentId) send();
  }

  /* ---------- 侧栏折叠 / 移动端 ---------- */
  function isNarrow() { return window.innerWidth < 1024; }
  function syncSidebar() {
    const app = $('app');
    const col = $('sidebarCol');
    if (!app || !col) return;
    if (isNarrow()) {
      const open = app.classList.contains('sidebar-open');
      col.classList.toggle('rail-mode', !open);
    } else {
      const collapsed = app.classList.contains('sidebar-collapsed');
      col.classList.toggle('rail-mode', collapsed);
    }
  }
  function toggleSidebar() {
    const app = $('app');
    if (!app) return;
    if (isNarrow()) app.classList.toggle('sidebar-open');
    else app.classList.toggle('sidebar-collapsed');
    syncSidebar();
    closePopup();
  }

  /* ---------- 输入框 ---------- */
  function autoGrow(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 336) + 'px';
  }
  function watchViewport() {
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        const seat = $('composerSeat');
        if (seat) seat.style.paddingBottom = Math.max(8, window.visualViewport.height - window.innerHeight + 8) + 'px';
      });
    }
  }

  /* ---------- 渲染总入口 ---------- */
  function renderAll() {
    renderSidebar();
    renderHeader();
    renderMessages();
  }

  /* ---------- 事件绑定 ---------- */
  function pendFor(sid) {
    let n = 0;
    for (const p of pendApprovals.values()) if (p.frame.sessionId === sid) n++;
    for (const p of pendQuestions.values()) if (p.frame.sessionId === sid) n++;
    return n;
  }
  function bindGlobalEvents() {
    const wsScroll = $('wsScroll');
    if (wsScroll) wsScroll.addEventListener('click', function (e) {
      const row = e.target.closest('[data-session]');
      if (row && !e.target.closest('[data-sa]')) {
        openSession(row.dataset.session);
        return;
      }
      const sa = e.target.closest('[data-sa]');
      if (sa) {
        e.stopPropagation();
        if (sa.dataset.sa === 'stop') stopSession(sa.dataset.session);
        else if (sa.dataset.sa === 'menu') openSessionMenu(sa);
        else if (sa.dataset.sa === 'new-in') newSessionIn(Number(sa.dataset.gidx));
        return;
      }
      const wsT = e.target.closest('[data-ws-toggle]');
      if (wsT) {
        const key = wsT.dataset.wsToggle;
        wsOpen.set(key, !(wsOpen.get(key) !== false));
        renderSidebar();
        return;
      }
    });
    const wsSearch = $('wsSearch');
    if (wsSearch) wsSearch.addEventListener('input', function () { renderSidebar(); });

    const msgColumn = $('msgColumn');
    if (msgColumn) msgColumn.addEventListener('click', function (e) {
      const moreBtn = e.target.closest('#loadMoreBtn');
      if (moreBtn) { loadMore(); return; }
      const toolRow = e.target.closest('[data-details]');
      if (toolRow) {
        const root = toolRow.closest('.tool-root');
        if (root) root.classList.toggle('open');
        return;
      }
      const toggle = e.target.closest('[data-toggle]');
      if (toggle) {
        toggle.classList.toggle('open');
        return;
      }
      const copyBtn = e.target.closest('[data-copy]');
      if (copyBtn) {
        copyText(decodeURIComponent(copyBtn.dataset.copy));
        return;
      }
      const appr = e.target.closest('[data-approval]');
      if (appr) {
        const idx = Number(appr.dataset.idx);
        decideApproval(idx, appr.dataset.approval === 'allow' ? 'allowed-once' : 'rejected');
        return;
      }
      const qOpen = e.target.closest('[data-action="open-questions"]');
      if (qOpen) { openQuestions(); return; }
      const fileRow = e.target.closest('[data-action="open-file"]');
      if (fileRow) toast('打开 ' + fileRow.dataset.file);
    });

    document.addEventListener('click', function (e) {
      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      if (action === 'toggle-sidebar') toggleSidebar();
      else if (action === 'new-session') newSession();
      else if (action === 'theme') cycleTheme();
      else if (action === 'more') openMoreMenu(actionEl);
      else if (action === 'model') openModelPopup(actionEl);
      else if (action === 'mode') openPresetPopup(actionEl);
      else if (action === 'commands') openCommandsPopup(actionEl);
      else if (action === 'skills') openSkillsPopup(actionEl);
      else if (action === 'attach') toast('当前会话不支持添加图片');
      else if (action === 'close-details') { closePopup(); }
      else if (action === 'open-file') toast('打开 ' + (actionEl.dataset.file || '文件'));
    });

    const portal = $('portal');
    if (portal) portal.addEventListener('click', function (e) {
      if (e.target.closest('[data-close-popup]')) { closePopup(); return; }
      const m = e.target.closest('[data-menu]');
      if (m) {
        const id = m.dataset.menu;
        closePopup();
        if (id === 'new') newSession();
        else if (id === 'rename') renameSession();
        else if (id === 'archive') archiveSession();
        else if (id === 'delete') { toast('手机端暂不支持删除，可归档'); }
        else if (id === 'theme-light' || id === 'theme-dark' || id === 'theme-system') { themePref = id.replace('theme-', ''); try { localStorage.setItem(THEME_KEY, themePref); } catch (_) {} applyTheme(); }
        return;
      }
      const sessMenu = e.target.closest('[data-sessmenu]');
      if (sessMenu) {
        const id = sessMenu.dataset.sessmenu;
        closePopup();
        if (sessMenu.dataset.act === 'rename') { currentId = id; renameSession(); }
        else if (sessMenu.dataset.act === 'archive') { currentId = id; archiveSession(); }
        else if (sessMenu.dataset.act === 'delete') toast('手机端暂不支持删除，可归档');
        return;
      }
      const ep = e.target.closest('[data-effort-popup]');
      if (ep) { openEffortPopup(ep); return; }
      const mp = e.target.closest('[data-model-provider]');
      if (mp) {
        const provider = mp.dataset.modelProvider, model = mp.dataset.model;
        closePopup();
        chooseModel(provider, model);
        return;
      }
      const eff = e.target.closest('[data-effort]');
      if (eff) {
        const v = eff.dataset.effort;
        closePopup();
        chooseEffort(v);
        return;
      }
      const preset = e.target.closest('[data-preset]');
      if (preset) {
        closePopup();
        choosePreset(preset.dataset.preset);
        return;
      }
      const cmd = e.target.closest('[data-command]');
      if (cmd) { closePopup(); sendCommand(cmd.dataset.command); return; }
      const sk = e.target.closest('[data-skill]');
      if (sk) { closePopup(); sendCommand('/skill ' + sk.dataset.skill); return; }
    });

    const sendBtn = $('sendBtn');
    if (sendBtn) sendBtn.addEventListener('click', function () {
      const s = sessions.get(currentId);
      if (s && s.running) stopCurrent();
      else send();
    });
    const input = $('composerInput');
    if (input) {
      input.addEventListener('input', function () { autoGrow(input); });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          send();
        }
      });
    }

    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        currentTab = tab.dataset.tab;
        renderAll();
      });
    });

    const msgScroll = $('msgScroll');
    if (msgScroll) msgScroll.addEventListener('scroll', function () {
      const sc = msgScroll;
      stickBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 90;
      if (sc.scrollTop < 60 && currentId && sessions.get(currentId) && sessions.get(currentId).hasMore) loadMore();
    });
    const toBottom = $('toBottom');
    if (toBottom) toBottom.addEventListener('click', function () { if ($('msgScroll')) $('msgScroll').scrollTo({ top: $('msgScroll').scrollHeight, behavior: 'smooth' }); });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closePopup(); closeQuestions(); }
    });
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制到剪贴板'); }, function () { toast('复制失败'); });
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('已复制到剪贴板'); } catch (err) { toast('复制失败'); }
      ta.remove();
    }
  }

        .model-label{max-width:110px}
        .tool-btns{flex:1;min-width:0;gap:6px}
        .trailing{flex:none}
        .tool-btn{padding:0 4px}
        .composer-card{border-radius:18px}
      }
      @media (max-width:360px){
        .mode-btns{gap:4px}
        .model-trigger{max-width:49%}
        .model-label{max-width:80px;font-size:12px}
      }
    `;
    document.head.appendChild(style);
  }

  /* ---------- 全局暴露（提问弹层内联事件需要） ---------- */
  window.optToggle = optToggle;
  window.customInput = customInput;
  window.submitQuestions = submitQuestions;
  window.cancelQuestions = cancelQuestions;
  window.closeQuestions = closeQuestions;

  /* ---------- 初始化 ---------- */

    setIcon('brandFish', ic('FishLogo', 26));
    setIcon('railFish', ic('FishLogo', 24));
    setIcon('toggleBtnWide', ic('IconPanelLeftOutline16', 16));
    setIcon('newChatIcon', ic('IconNewChatOutline16', 14));
    setIcon('searchIcon', ic('IconSearchOutline16', 14));
    setIcon('settingsIconWide', ic('IconSettingsOutline16', 14));
    setIcon('railNew', ic('IconNewChatOutline16', 18));
    setIcon('railSettings', ic('IconSettingsOutline16', 18));
    setIcon('ctxRing', '<span class="ctx-ring">' + '<svg width="18" height="18" viewBox="0 0 18 18"><circle class="ctx-track" cx="9" cy="9" r="7.5" fill="none" stroke="var(--c-border-l3)" stroke-width="2"/><circle class="ctx-fill" cx="9" cy="9" r="7.5" fill="none" stroke="var(--c-state-business)" stroke-width="2" stroke-linecap="round" stroke-dasharray="30 100" transform="rotate(-90 9 9)"/></svg>' + '</span>');
    setIcon('statsIcon', ic('IconDataOutline16', 16));
    setIcon('moreIcon', ic('IconEllipsisOutline16', 16));
    setIcon('attachIcon', ic('IconPaperclipOutline16', 14));
    setIcon('cmdIcon', ic('IconListPenOutline16', 14));
    setIcon('skillIcon', ic('IconSkillOutline16', 14));
    setIcon('modelSparkIcon', ic('IconSparkle16', 14));
    setIcon('modelChev', ic('IconChevronDownOutline14', 14));
  }
  function init() {
    injectExtraUI();
    initIcons();
    applyTheme();
    syncSidebar();
    renderAll();
    bindGlobalEvents();
    watchViewport();
    window.addEventListener('resize', function () { syncSidebar(); });
    connectMux();
    connectHost();
    refreshList();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
